<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Be My Valentine? 💘</title>
  <style>
    :root {
      --bg1: #ffdde1;
      --bg2: #ee9ca7;
      --card: rgba(255, 255, 255, 0.9);
      --text: #2b2b2b;
      --yes: #ff4d6d;
      --no: #6c757d;
      --shadow: 0 18px 50px rgba(0,0,0,0.12);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top left, var(--bg1), var(--bg2));
      overflow: hidden;
    }

    /* Floating hearts */
    .heart {
      position: absolute;
      width: 14px;
      height: 14px;
      background: rgba(255, 77, 109, 0.55);
      transform: rotate(45deg);
      border-radius: 2px;
      animation: floatUp linear infinite;
      filter: blur(0.2px);
    }
    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      background: inherit;
      border-radius: 50%;
    }
    .heart::before { left: -7px; top: 0; }
    .heart::after { top: -7px; left: 0; }

    @keyframes floatUp {
      from { transform: translateY(30vh) rotate(45deg); opacity: 0; }
      10% { opacity: 1; }
      to { transform: translateY(-110vh) rotate(45deg); opacity: 0; }
    }

    .card {
      width: min(92vw, 520px);
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 28px 22px;
      text-align: center;
      backdrop-filter: blur(6px);
      position: relative;
    }

    .badge {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 77, 109, 0.12);
      border: 1px solid rgba(255, 77, 109, 0.18);
      font-weight: 600;
      margin-bottom: 14px;
    }

    h1 {
      margin: 10px 0 10px;
      font-size: clamp(28px, 4vw, 38px);
      letter-spacing: -0.5px;
    }
    p {
      margin: 0 auto 18px;
      line-height: 1.5;
      font-size: 16px;
      max-width: 42ch;
    }

    .note {
      font-size: 14px;
      opacity: 0.85;
      margin-top: 6px;
    }

    .buttons {
      margin-top: 18px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      padding: 12px 18px;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      box-shadow: 0 10px 20px rgba(0,0,0,0.12);
      font-size: 16px;
    }

    #yesBtn {
      background: var(--yes);
      color: #fff;
    }
    #yesBtn:hover { transform: translateY(-2px) scale(1.02); }

    #noBtn {
      background: var(--no);
      color: #fff;
      position: relative;
    }

    .result {
      display: none;
      margin-top: 18px;
      padding: 14px 14px;
      border-radius: 16px;
      background: rgba(255, 77, 109, 0.1);
      border: 1px solid rgba(255, 77, 109, 0.18);
      font-weight: 650;
    }

    .footer {
      margin-top: 14px;
      font-size: 12px;
      opacity: 0.7;
    }

    /* Confetti */
    canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <canvas id="confetti"></canvas>

  <div class="card">
    <div class="badge">💘 Valentine Request</div>

    <h1>Will you be my Valentine? 🥰</h1>

    <p>
      Ibukunoluwa my love, you make my days brighter and my heart happier.
      I’d love to spend Valentine’s Day with you. 💐
      Please will you be my Valentine?
    </p>

    <div class="buttons">
      <button id="yesBtn">Yes! 💖</button>
      <button id="noBtn">No 🙈</button>
    </div>

    <div class="result" id="result"></div>

    <div class="footer">Made with love from Adeyemi ✨</div>
  </div>

  <script>
    // --- Floating hearts background ---
    const makeHearts = (count = 18) => {
      for (let i = 0; i < count; i++) {
        const h = document.createElement("div");
        h.className = "heart";
        const left = Math.random() * 100;
        const size = 10 + Math.random() * 16;
        const dur = 6 + Math.random() * 10;
        const delay = Math.random() * 6;

        h.style.left = left + "vw";
        h.style.width = size + "px";
        h.style.height = size + "px";
        h.style.animationDuration = dur + "s";
        h.style.animationDelay = delay + "s";
        h.style.background = `rgba(255, 77, 109, ${0.25 + Math.random() * 0.45})`;

        document.body.appendChild(h);
      }
    };
    makeHearts();

    // --- Button behavior ---
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const result = document.getElementById("result");

    const sweetMessages = [
      "Yay!! 💖 I knew it 😭✨",
      "Best answer ever 🥰💘",
      "You just made me the happiest person 🫶",
      "Okay wow... I’m blushing 😳💞"
    ];

    yesBtn.addEventListener("click", () => {
      result.style.display = "block";
      result.textContent = sweetMessages[Math.floor(Math.random() * sweetMessages.length)];
      popConfetti();
    });

    // "No" button dodges the cursor (playful)
    const dodge = () => {
      const maxX = window.innerWidth - noBtn.offsetWidth - 24;
      const maxY = window.innerHeight - noBtn.offsetHeight - 24;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.position = "fixed";
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
      noBtn.style.transform = "scale(0.98)";
      setTimeout(() => (noBtn.style.transform = "scale(1)"), 120);
    };

    noBtn.addEventListener("mouseenter", dodge);
    noBtn.addEventListener("click", dodge);

    // --- Confetti (tiny, lightweight) ---
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");
    let confettiPieces = [];
    let rafId = null;

    const resizeCanvas = () => {
      canvas.width = window.innerWidth * devicePixelRatio;
      canvas.height = window.innerHeight * devicePixelRatio;
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    };
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function popConfetti() {
      confettiPieces = Array.from({ length: 160 }, () => ({
        x: Math.random() * window.innerWidth,
        y: -20 - Math.random() * 200,
        r: 3 + Math.random() * 5,
        vx: -2 + Math.random() * 4,
        vy: 2 + Math.random() * 6,
        rot: Math.random() * Math.PI,
        vr: -0.2 + Math.random() * 0.4,
        a: 1
      }));

      if (rafId) cancelAnimationFrame(rafId);
      animateConfetti();
      setTimeout(() => {
        if (rafId) cancelAnimationFrame(rafId);
        rafId = null;
        confettiPieces = [];
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      }, 2200);
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      for (const p of confettiPieces) {
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        p.a *= 0.995;

        ctx.save();
        ctx.globalAlpha = p.a;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);

        // Random pastel-ish confetti
        const hue = 330 + Math.random() * 60; // pinky range
        ctx.fillStyle = `hsl(${hue}, 90%, 70%)`;
        ctx.fillRect(-p.r, -p.r, p.r * 2, p.r * 2);

        ctx.restore();
      }

      rafId = requestAnimationFrame(animateConfetti);
    }
  </script>
</body>
</html>
